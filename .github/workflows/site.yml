name: Screenshots and site

# Runs both apps on an Android emulator, screenshots their main screens,
# keeps the screenshots on the "screenshots" branch (shown in the README),
# and publishes the project site (docs/site) to GitHub Pages with them.
on:
  push:
    branches: [main]
    paths:
      - "sensors_app/**"
      - "app_scanner/**"
      - "docs/site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

# Flutter release used for every build. Every action is pinned to a full
# commit SHA, which the repository settings require.
env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # pushes the screenshots branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      # Flutter straight from its own repository at a fixed release, instead of
      # a third-party setup action (fewer dependencies to trust).
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone -q --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics > /dev/null
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
        working-directory: sensors_app
      - run: flutter pub get
        working-directory: app_scanner
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2 (pinned: third-party)
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -camera-back none
          disable-animations: true
          script: |
            adb shell settings put system system_locales ar-SA || true
            cd sensors_app && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d emulator-5554 2>&1 | tee ../sensors.log; cd ..
            cd app_scanner && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d emulator-5554 2>&1 | tee ../scanner.log; cd ..
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p shots/sensors shots/scanner
          cp sensors_app/screenshots/*.png shots/sensors/ 2>/dev/null || true
          cp app_scanner/screenshots/*.png shots/scanner/ 2>/dev/null || true
          ls -R shots
          grep -q "All tests passed" sensors.log
          grep -q "All tests passed" scanner.log
      # Kept on their own branch so main is not rewritten by CI.
      - name: Publish to the screenshots branch
        working-directory: shots
        run: |
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: shots/

  pages:
    needs: screenshots
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: screenshots
          path: docs/site/screenshots
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
