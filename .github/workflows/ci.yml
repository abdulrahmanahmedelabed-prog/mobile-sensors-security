name: CI

# Every push: test mvscan, scan both apps' source with it, test and build
# both apps, then scan the built APKs too. On main, the APKs are published to
# the "app-latest" release so the README links always point to the newest build.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # findings appear under the repository's Security tab
    defaults:
      run:
        working-directory: mobile_vuln_scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
      # Dogfooding: both apps must have no finding of low severity or above.
      - name: Scan both apps' source
        run: |
          python -m mvscan ../sensors_app ../app_scanner --format html -o mvscan-source-report.html
          python -m mvscan ../sensors_app ../app_scanner --format sarif --sarif-base .. -o mvscan.sarif
          python -m mvscan ../sensors_app ../app_scanner --fail-on low
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name == 'push'
        continue-on-error: true  # code scanning may be unavailable on some plans
        with:
          sarif_file: mobile_vuln_scanner/mvscan.sarif
          category: mvscan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvscan-source-report
          path: mobile_vuln_scanner/mvscan-source-report.html

  app:
    runs-on: ubuntu-latest
    needs: scanner
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: sensors_app
            apk: sensors-lab
          - dir: app_scanner
            apk: app-scanner
    permissions:
      contents: write  # publishes the app-latest release on main
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Release key from repository secrets when configured (see README).
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No release key configured; APKs are signed with a debug key."
          fi
      - name: Build APKs (obfuscated)
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/${{ matrix.apk }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/${{ matrix.apk }}-armv7-old-phones.apk
          ls -l dist
      - name: Scan the built APK
        run: |
          APK=$PWD/dist/${{ matrix.apk }}-arm64.apk
          cd ../mobile_vuln_scanner
          python -m mvscan "$APK" --format html -o "../${{ matrix.dir }}/dist/${{ matrix.apk }}-mvscan-report.html"
          python -m mvscan "$APK" --min-severity low --fail-on medium
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}-android
          path: ${{ matrix.dir }}/dist/
          retention-days: 30
      - name: Publish to the app-latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both matrix jobs may get here at once: creating twice is harmless.
          gh release view app-latest >/dev/null 2>&1 || \
            gh release create app-latest --title "أحدث نسخة" --notes "تُحدَّث تلقائيًا بعد كل تعديل على main." --latest || true
          gh release upload app-latest dist/*.apk dist/*.html --clobber
