name: CI

# Every push: test the scanner, scan the app's source with it, test and build
# the app, then scan the built APK too. On main, the APKs are published to
# the "app-latest" release so the README links always point to the newest build.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_vuln_scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
      # Dogfooding: the sensors app must have no finding of low severity or above.
      - name: Scan the sensors app source
        run: |
          python -m mvscan ../sensors_app --format html -o mvscan-source-report.html
          python -m mvscan ../sensors_app --fail-on low
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvscan-source-report
          path: mobile_vuln_scanner/mvscan-source-report.html

  app:
    runs-on: ubuntu-latest
    needs: scanner
    permissions:
      contents: write  # publishes the app-latest release on main
    defaults:
      run:
        working-directory: sensors_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Release key from repository secrets when configured (see README).
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No release key configured; APKs are signed with a debug key."
          fi
      - name: Build APKs (obfuscated)
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/sensors-lab-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/sensors-lab-armv7-old-phones.apk
          ls -l dist
      - name: Scan the built APK
        run: |
          cd ../mobile_vuln_scanner
          python -m mvscan ../sensors_app/dist/sensors-lab-arm64.apk --format html -o ../sensors_app/dist/mvscan-apk-report.html
          python -m mvscan ../sensors_app/dist/sensors-lab-arm64.apk --min-severity low --fail-on medium
      - uses: actions/upload-artifact@v4
        with:
          name: sensors-lab-android
          path: sensors_app/dist/
          retention-days: 30
      - name: Publish to the app-latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || \
            gh release create app-latest --title "أحدث نسخة" --notes "تُحدَّث تلقائيًا بعد كل تعديل على main." --latest
          gh release upload app-latest dist/sensors-lab-arm64.apk dist/sensors-lab-armv7-old-phones.apk dist/mvscan-apk-report.html --clobber
